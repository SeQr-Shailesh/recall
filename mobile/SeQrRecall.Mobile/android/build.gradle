buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
        // AGP defaults to CMake 3.22.1, whose Ninja build cannot stat object paths over 260
        // characters on this Windows checkout. 3.30.5 hashes long object names instead.
        cmakeVersion = "3.30.5"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// Third-party native modules would otherwise keep the AGP defaults, which do not survive the
// 260-character Windows path limit on a release build: `.cxx/RelWithDebInfo/<hash>/prefab/...`
// under `node_modules/<module>/android` produces prefab config paths Ninja cannot stat, and it
// then reports `manifest 'build.ninja' still dirty after 100 tries`. Staging native output next
// to the Gradle root keeps those paths short enough.
subprojects { subproject ->
    subproject.plugins.withId("com.android.library") {
        subproject.android {
            externalNativeBuild {
                cmake {
                    version = rootProject.ext.cmakeVersion
                    buildStagingDirectory = new File(rootProject.projectDir, ".cxx/${subproject.name}")
                }
            }
        }
    }
}
